input:
  kafka:
    addresses: [ "kafka:9092" ]
    topics: [ "events" ]
    consumer_group: "benthos-enrich"

pipeline:
  processors:
    - http:
        url: 'https://enrich.example.com/user/${! json("user_id") }'
        verb: GET
        timeout: 5s
        retries: 3
        backoff:
          initial_interval: 300ms
          max_interval: 5s
          max_elapsed_time: 20s
        result_map: |
          root = this
    - mapping: |
        root = content().merge({
          "enrichment": this
        })

output:
  switch:
    cases:
      - check: 'this.enrichment != null && this.enrichment.exists("tier")'
        output:
          kafka:
            addresses: [ "kafka:9092" ]
            topic: "events-enriched"
      - output:
          kafka:
            addresses: [ "kafka:9092" ]
            topic: "events-enrich-failed"
