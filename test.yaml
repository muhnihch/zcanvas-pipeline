input:
  kafka:
    addresses: [ "kafka:9092" ]
    topics: [ "raw-events" ]
    consumer_group: "benthos-events-to-http"
    start_from_oldest: false

pipeline:
  processors:
    - mapping: |
        root = this
        root.ingested_at = now()
        root.event_type = this.type.or("unknown")
        root.user_id = this.user.id.or("")
        root.payload = this

    - log:
        level: INFO
        message: 'Sending event type=${! json("event_type") } user_id=${! json("user_id") }'

output:
  fallback:
    - http_client:
        url: "https://api.example.com/events"
        verb: POST
        headers:
          Content-Type: application/json
        timeout: 10s
        retries: 5
        backoff:
          initial_interval: 500ms
          max_interval: 10s
          max_elapsed_time: 1m
    - kafka:
        addresses: [ "kafka:9092" ]
        topic: "raw-events-dlq"
